<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f6"><title>Hurtigregner — enkel lommeregner</title>
<style>
:root{color-scheme:light;--ink:#17231e;--muted:#78817b;--line:#e6eae6;--paper:#f7f8f6;--green:#b9f36a;--dark:#18241e;--soft:#eef1ed}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(100%,440px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:750;letter-spacing:-.4px}.mark{width:28px;height:28px;border-radius:9px;background:var(--dark);display:grid;place-items:center;color:var(--green);font-size:17px}.tag{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:7px 10px;border-radius:30px}h1{font-size:clamp(30px,8vw,40px);line-height:1.05;letter-spacing:-1.8px;margin:0 0 9px;font-weight:750}.sub{margin:0 0 25px;color:var(--muted);font-size:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 18px 60px #17231e0a}.screen{min-height:146px;border-radius:16px;background:var(--soft);padding:18px;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:15px;overflow:hidden}.history{font-size:13px;color:var(--muted);min-height:20px;text-align:right;overflow-wrap:anywhere}.display{font-size:clamp(36px,10vw,50px);font-weight:650;letter-spacing:-2px;text-align:right;overflow-wrap:anywhere;line-height:1.15}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.key{border:0;min-height:60px;border-radius:15px;background:#f3f5f2;color:var(--ink);font-size:19px;font-weight:600;cursor:pointer;transition:transform .12s,background .12s;user-select:none}.key:hover{background:#e9ede8}.key:active{transform:scale(.96)}.key.fn{color:#4b5b51;background:#e8ece7}.key.op{background:#e8f5d9;color:#29451b;font-size:22px}.key.equal{background:var(--dark);color:var(--green);font-size:24px}.key.zero{grid-column:span 2}.foot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:16px;color:var(--muted);font-size:11px}.foot span:last-child{display:flex;align-items:center;gap:5px;white-space:nowrap}.dot{width:6px;height:6px;background:#72b94b;border-radius:50%}@media(max-width:380px){body{padding:16px}.panel{padding:12px}.key{min-height:54px;border-radius:12px}.keys{gap:7px}.screen{min-height:130px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><span class="mark">＋</span> hurtigregner</div><span class="tag">ENKEL · HURTIG · GRATIS</span></header><h1>Tal, der giver<br>mening.</h1><p class="sub">En enkel lommeregner til hverdagen.</p><section class="panel" aria-label="Lommeregner"><div class="screen" aria-live="polite"><div class="history" id="history">Klar til at regne</div><div class="display" id="display">0</div></div><div class="keys" id="keys">
<button class="key fn" data-action="clear">AC</button><button class="key fn" data-action="sign">+/−</button><button class="key fn" data-action="percent">%</button><button class="key op" data-op="÷">÷</button>
<button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key op" data-op="×">×</button>
<button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key op" data-op="−">−</button>
<button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key op" data-op="+">+</button>
<button class="key zero" data-digit="0">0</button><button class="key" data-action="decimal">,</button><button class="key equal" data-action="equals">=</button></div><div class="foot"><span>Tip: Brug også tastaturet</span><span><i class="dot"></i> Klar</span></div></section></main>
<script>(()=>{const d=document.getElementById('display'),h=document.getElementById('history'),keys=document.getElementById('keys');let current='0',stored=null,op=null,reset=false;const fmt=n=>Number.isFinite(n)?String(Number(n.toPrecision(11))).replace('.',','):'Fejl';const show=()=>d.textContent=current;const calc=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?(b===0?NaN:a/b):b;function digit(v){if(current==='Fejl')current='0';if(reset){current=v;reset=false}else if(current==='0')current=v;else if(current.replace('-','').replace(',','').length<14)current+=v;show()}function choose(o){if(current==='Fejl')return;const n=Number(current.replace(',','.'));if(op&&stored!==null&&!reset){const r=calc(stored,n,op);current=fmt(r);stored=Number.isFinite(r)?r:null;show()}else stored=n;op=o;h.textContent=current+' '+o;reset=true}function equals(){if(op===null||stored===null)return;const a=stored,b=Number(current.replace(',','.')),o=op;current=fmt(calc(a,b,o));h.textContent=fmt(a)+' '+o+' '+fmt(b)+' =';show();stored=null;op=null;reset=true}keys.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.digit!==undefined)return digit(b.dataset.digit);if(b.dataset.op)return choose(b.dataset.op);switch(b.dataset.action){case'clear':current='0';stored=null;op=null;reset=false;h.textContent='Klar til at regne';show();break;case'sign':if(current!=='0'&&current!=='Fejl')current=current.startsWith('-')?current.slice(1):'-'+current;show();break;case'percent':if(current!=='Fejl')current=fmt(Number(current.replace(',','.'))/100);show();break;case'decimal':if(reset){current='0,';reset=false}else if(!current.includes(','))current+=',';show();break;case'equals':equals()}});document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))digit(e.key);else if(e.key==='.'||e.key===',')keys.querySelector('[data-action=decimal]').click();else if(['+','-','*','/'].includes(e.key)){e.preventDefault();choose(({'+':'+','-':'−','*':'×','/':'÷'})[e.key])}else if(e.key==='Enter'||e.key==='=')equals();else if(e.key==='Escape'||e.key==='Delete')keys.querySelector('[data-action=clear]').click();else if(e.key==='%')keys.querySelector('[data-action=percent]').click()})})();</script></body></html>
